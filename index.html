<meta name="theme-color" content="#0a0a0f">
<title>⚽ Regreso al Juego</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: #0a0a0f; color: #e8e4dc; font-family: -apple-system, 'SF Pro Display', system-ui, sans-serif; min-height: 100vh; padding-bottom: 80px; }
  .header { background: linear-gradient(135deg, #0f0f1a 0%, #1a1025 100%); border-bottom: 1px solid #2a2040; padding: 52px 20px 20px; text-align: center; }
  .header-eyebrow { font-size: 10px; letter-spacing: 4px; color: #8b7fa8; text-transform: uppercase; margin-bottom: 6px; }
  .header-title { font-size: 24px; font-weight: 800; color: #fff; letter-spacing: -0.5px; }
  .header-stats { display: flex; justify-content: center; gap: 40px; margin-top: 16px; }
  .stat-box { text-align: center; }
  .stat-val { font-size: 22px; font-weight: 900; }
  .stat-lbl { font-size: 9px; color: #6b6080; text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }
  .header-status { margin-top: 10px; font-size: 11px; font-weight: 600; letter-spacing: 0.5px; }

  .start-banner { margin: 14px 20px 0; background: #0f0f1a; border: 1px solid #2a2040; border-radius: 12px; padding: 12px 14px; font-size: 12px; color: #a094c0; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .start-banner button { background: #4c3880; color: #fff; border: none; border-radius: 7px; padding: 7px 11px; font-size: 11px; font-weight: 700; cursor: pointer; flex-shrink: 0; }
  .start-banner .link { color: #6b6080; font-size: 10.5px; text-decoration: underline; cursor: pointer; flex-shrink: 0; }

  .week-nav { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; background: #0f0f1a; border-bottom: 1px solid #1e1a2e; position: sticky; top: 0; z-index: 10; }
  .week-btn { background: #1e1a2e; border: none; color: #a094c0; border-radius: 8px; padding: 6px 16px; font-size: 16px; cursor: pointer; }
  .week-info { text-align: center; }
  .week-title { font-weight: 700; font-size: 14px; color: #fff; }
  .week-sub { font-size: 10px; color: #6b6080; margin-top: 2px; }

  .tab-bar { display: flex; gap: 8px; padding: 12px 20px 0; }
  .tab-btn { flex: 1; padding: 9px 0; border-radius: 10px; border: none; font-weight: 600; font-size: 12px; cursor: pointer; transition: all 0.2s; }
  .tab-btn.active { background: #4c3880; color: #fff; }
  .tab-btn.inactive { background: #1a1630; color: #6b6080; }

  .content { padding: 16px 20px; }

  .section-title { margin-top: 24px; margin-bottom: 10px; }
  .section-title:first-child { margin-top: 8px; }
  .section-title-row { display: flex; align-items: center; gap: 8px; }
  .section-title-text { font-weight: 800; font-size: 14px; color: #fff; letter-spacing: -0.3px; }
  .section-subtitle { font-size: 10px; color: #5a5070; margin-top: 2px; margin-left: 26px; letter-spacing: 0.5px; text-transform: uppercase; }

  .level-badge { display: inline-block; background: #1a1630; border: 1px solid #4c3880; color: #a094c0; font-size: 10px; font-weight: 700; padding: 4px 10px; border-radius: 20px; margin-bottom: 12px; }

  .day-folder { background: #0f0f1a; border: 1px solid #1e1a2e; border-radius: 14px; margin-bottom: 10px; overflow: hidden; }
  .day-folder-header { padding: 14px; display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .day-folder-icon { font-size: 18px; flex-shrink: 0; }
  .day-folder-body { flex: 1; }
  .day-folder-name { font-weight: 700; font-size: 14px; color: #e8e4dc; }
  .day-folder-sub { font-size: 11px; color: #5a5070; margin-top: 2px; }
  .day-folder-badges { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .badge { font-size: 10px; font-weight: 700; padding: 3px 7px; border-radius: 20px; }
  .badge.ok { background: rgba(34,197,94,0.15); color: #4ade80; }
  .badge.mid { background: rgba(245,158,11,0.15); color: #f59e0b; }
  .badge.high { background: rgba(239,68,68,0.15); color: #ef4444; }
  .chevron { font-size: 12px; color: #5a5070; transition: transform 0.2s; }
  .chevron.open { transform: rotate(90deg); }

  .day-folder-content { display: none; padding: 0 14px 14px; border-top: 1px solid #1e1a2e; }
  .day-folder-content.open { display: block; padding-top: 12px; }

  .day-type-row { margin-bottom: 12px; }
  .day-type-row label { font-size: 10px; color: #5a5070; display: block; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
  .day-type-row select { width: 100%; background: #1a1630; border: 1px solid #2a2040; color: #e8e4dc; border-radius: 8px; padding: 8px 10px; font-size: 12.5px; font-family: inherit; }

  .rest-note { font-size: 12px; color: #5a5070; padding: 6px 0 14px; line-height: 1.5; }

  .exercise-row { display: flex; align-items: flex-start; gap: 10px; padding: 9px 0; border-bottom: 1px solid #16131f; }
  .exercise-row:last-of-type { border-bottom: none; }
  .exercise-check { width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid #2a2040; display: flex; align-items: center; justify-content: center; font-size: 13px; cursor: pointer; flex-shrink: 0; margin-top: 1px; }
  .exercise-check.done { background: #1e3a22; border-color: #2a5030; }
  .exercise-name { font-size: 12.5px; color: #e8e4dc; font-weight: 600; }
  .exercise-reps { font-size: 10.5px; color: #5a5070; margin-top: 1px; }
  .exercise-video { display: inline-block; margin-top: 5px; font-size: 10.5px; font-weight: 700; color: #a094c0; text-decoration: none; padding: 3px 9px; background: #1a1630; border-radius: 20px; border: 1px solid #2a2040; }
  .ex-rom-select { display: block; margin-top: 6px; background: #1a1630; border: 1px solid #2a2040; color: #a094c0; border-radius: 7px; padding: 5px 8px; font-size: 11px; font-family: inherit; max-width: 160px; }
  .rom-info-block { background: #1a1630; border: 1px solid #2a2040; border-radius: 10px; padding: 12px; margin-bottom: 12px; }
  .rom-info-text { font-size: 11px; color: #8b7fa8; line-height: 1.5; text-align: center; }
  .exercise-group-label { font-size: 10.5px; color: #8b7fa8; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; margin: 14px 0 4px; }
  .exercise-group-label:first-of-type { margin-top: 4px; }

  .flag-toggle { width: 100%; margin-top: 4px; padding: 10px; border-radius: 8px; border: 1px solid #3a1a1a; background: #1a0f0f; color: #c0a0a0; font-size: 12px; font-weight: 700; cursor: pointer; }
  .flag-toggle.on { background: #ef4444; border-color: #ef4444; color: #fff; }

  .control-block { margin-top: 14px; padding-top: 12px; border-top: 1px dashed #1e1a2e; }
  .control-title { font-size: 10px; color: #8b7fa8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
  .control-row { display: flex; gap: 10px; margin-bottom: 10px; }
  .control-field { flex: 1; }
  .control-field label { font-size: 10.5px; color: #5a5070; display: block; margin-bottom: 4px; }
  .control-field input, .control-field select { width: 100%; background: #1a1630; border: 1px solid #2a2040; color: #e8e4dc; border-radius: 8px; padding: 8px 10px; font-size: 13px; font-family: inherit; }
  .save-day-btn { width: 100%; padding: 10px; border-radius: 8px; border: none; background: #4c3880; color: #fff; font-weight: 700; font-size: 12.5px; cursor: pointer; }

  .limits-card { background: #1a0f0f; border: 1px solid #3a1a1a; border-radius: 14px; padding: 14px; }
  .limit-row { display: flex; gap: 10px; padding: 8px 0; align-items: flex-start; }
  .limit-row:not(:last-child) { border-bottom: 1px solid #2a1515; }
  .limit-x { color: #ef4444; font-size: 14px; flex-shrink: 0; }
  .limit-text { font-size: 12px; color: #c0a0a0; line-height: 1.5; }

  .review-hero { background: #0f0f1a; border: 1px solid #2a2040; border-radius: 16px; padding: 20px; margin-bottom: 16px; text-align: center; }
  .review-eyebrow { font-size: 10px; color: #6b6080; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 6px; }
  .review-pct { font-size: 52px; font-weight: 900; line-height: 1; }

function localDateStr(date) {
  const dt = date || new Date();
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
}
function mondayOf(dt) {
  const m = new Date(dt.getFullYear(), dt.getMonth(), dt.getDate());
  m.setDate(m.getDate() - ((m.getDay() + 6) % 7));
  return m;
}
// Semana 1 = la semana (lunes a domingo) donde caiga tu fecha de inicio.
function currentWeekNumber() {
  if (!state.data.startDate) return 1;
  const [y, mo, d] = state.data.startDate.split('-').map(Number);
  const diff = Math.round((mondayOf(new Date()) - mondayOf(new Date(y, mo-1, d))) / (7*24*60*60*1000));
  return Math.max(1, Math.min(WEEKS_TOTAL, diff + 1));
}
function todayDayIndex() { return (new Date().getDay() + 6) % 7; }
function goToCurrentWeek() {
  state.week = currentWeekNumber();
  state.expanded[dayKey(state.week, todayDayIndex())] = true;

  saveState(); render();
}

}

}
function toggleCheckpoint(w, id) {
  const key = `cp_w${w}_${id}`;
  state.data[key] = !state.data[key];
  saveState(); render();
}
function checkpointStatus(w) {
  const c1 = !!state.data[`cp_w${w}_c1`];
  const c2 = autoNoFlags(w);
  const c3 = !!state.data[`cp_w${w}_c3`];
  return { c1, c2, c3, allMet: c1 && c2 && c3, anyMarked: c1 || c3 };
}
function currentLevel(w) {
  let level = 0;
  CHECKPOINT_WEEKS.forEach(cw => {
    if (w > cw && level < MAX_LEVEL) {
      if (checkpointStatus(cw).allMet) level++;
    }
  });
  return level;
}

// ---- Scoring ----
function weekScore(w) {
  let total = 0, done = 0;
  const level = currentLevel(w);
  for (let d = 0; d < 7; d++) {
    const type = getDayRoutineType(w, d);
    if (!type) continue;
    const routine = getRoutine(level, type);
    const allItems = [...warmupFor(type), ...routine.exercises, ...COOLDOWN];
    total += allItems.length;
    allItems.forEach(ex => { if (state.data[`${dayKey(w,d)}_ex_${ex.id}`]) done++; });
  }
  return { done, total, pct: total ? Math.round((done/total)*100) : 0 };
}
function overallScore() {
  let td = 0, ta = 0;
  for (let w = 1; w <= WEEKS_TOTAL; w++) { const s = weekScore(w); td += s.done; ta += s.total; }
  return ta ? Math.round((td/ta)*100) : 0;
}
function weekAvgPain(w) {
  const vals = [];
  for (let d = 0; d < 7; d++) {
    const p = state.data[`${dayKey(w,d)}_pain`];
    if (p !== undefined && p !== null) vals.push(p);
  }
  if (vals.length === 0) return null;
  return (vals.reduce((a,b)=>a+b,0) / vals.length).toFixed(1);
}

function pctColor(p) { if (p >= 80) return '#22c55e'; if (p >= 50) return '#f59e0b'; return '#ef4444'; }
function pctLabel(p) {
  if (p >= 90) return 'Constancia de atleta 🔥';
  if (p >= 70) return 'Avanzando bien 💪';
  if (p >= 50) return 'En progreso — sube el ritmo ⚡';
  return 'Área de mejora — sin excusas ⚠️';
}
function painBadgeClass(pain) {
  if (pain === undefined || pain === null) return null;
  if (pain <= 3) return 'ok';
  if (pain <= 6) return 'mid';
  return 'high';
}

function renderStartBanner() {
  if (!state.data.startDate) {
    return `<div class="start-banner"><span>📅 Aún no marcas el inicio de tu proceso de recuperación.</span><button onclick="markStartToday()">Marcar hoy</button></div>`;
  }
  const weeks = weeksSinceStart();
  return `<div class="start-banner">
    <span>📅 Iniciaste el <b>${state.data.startDate}</b> — hoy estás en la <b>semana ${weeks}</b></span>
    <span style="display:flex; gap:10px; flex-shrink:0;">
      <span class="link" onclick="changeStartDate()">cambiar</span>
      <span class="link" onclick="clearStartDate()">borrar</span>
    </span>
  </div>`;
}

function render() {
  const ws = weekScore(state.week);
  const overall = overallScore();

  let html = `
  <div class="header">
    <div class="header-eyebrow">Plan de recuperación</div>
    <div class="header-title">⚽ REGRESO AL JUEGO</div>
    <div class="header-stats">
      <div class="stat-box"><div class="stat-val" style="color:${pctColor(ws.pct)}">${ws.pct}%</div><div class="stat-lbl">Esta semana</div></div>
      <div class="stat-box"><div class="stat-val" style="color:${pctColor(overall)}">${overall}%</div><div class="stat-lbl">Todo el plan</div></div>
    </div>
    <div class="header-status" style="color:${pctColor(ws.pct)}">${pctLabel(ws.pct)}</div>
  </div>

  ${renderStartBanner()}

  <div class="week-nav">
    <button class="week-btn" onclick="changeWeek(-1)">◀</button>
    <div class="week-info">
      <div class="week-title">Semana ${state.week} de ${WEEKS_TOTAL}</div>
      <div class="week-sub">${ws.done}/${ws.total} ejercicios</div>
      ${state.week !== currentWeekNumber() ? `<div class="week-sub" style="color:#a094c0;text-decoration:underline;cursor:pointer;" onclick="goToCurrentWeek();render();">Ir a mi semana actual (${currentWeekNumber()})</div>` : ''}
    </div>
    <button class="week-btn" onclick="changeWeek(1)">▶</button>
  </div>

  <div class="tab-bar">
    <button class="tab-btn ${state.view==='week'?'active':'inactive'}" onclick="setView('week')">📅 Semana</button>
    <button class="tab-btn ${state.view==='review'?'active':'inactive'}" onclick="setView('review')">📊 Revisión Dominical</button>
  </div>

  <div class="content">
  `;

  html += state.view === 'week' ? renderWeekView() : renderReviewView(ws);

  html += `</div>`;
  document.getElementById('app').innerHTML = html;
}

function renderCheckpointCard(w) {
  const status = checkpointStatus(w);
  let h = `<div class="checkpoint-card">
    <div class="checkpoint-eyebrow">Revisión de bloque · Semana ${w}</div>
    <div class="checkpoint-goal">🎯 Meta de este bloque: fortalecer tu rodilla en fuerza y estabilidad</div>

    <div class="checkpoint-item" onclick="toggleCheckpoint(${w},'c1')">
      <div class="checkpoint-check ${status.c1?'done':''}">${status.c1?'✓':''}</div>
      <div class="checkpoint-text">Dolor máximo 5/10 al entrenar y a la mañana siguiente vuelve a 0-2, sin cojera ni hinchazón.</div>
    </div>
    <div class="checkpoint-item auto">
      <div class="checkpoint-check ${status.c2?'done':'fail'}">${status.c2?'✓':'✕'}</div>
      <div class="checkpoint-text">Cero hinchazón o chasquidos en las últimas 1-2 semanas.<small>Automático, según tus banderas 🚩 marcadas en los días.</small></div>
    </div>
    <div class="checkpoint-item" onclick="toggleCheckpoint(${w},'c3')">
      <div class="checkpoint-check ${status.c3?'done':''}">${status.c3?'✓':''}</div>
      <div class="checkpoint-text">${CP_STRENGTH[w]||''}</div>
    </div>`;

  if (status.allMet) {
    h += `<div class="checkpoint-result ok">✅ Objetivo cumplido — tu rutina sube de nivel automáticamente a partir de la próxima semana.</div>`;
  } else if (status.anyMarked) {
    h += `<div class="checkpoint-result pending">⚠️ Aún no cumples los 3 — repite este bloque 2 semanas más y vuelve a revisar.</div>`;
  } else {
    h += `<div class="checkpoint-result pending">⚠️ Revisa los criterios de arriba con honestidad antes de subir de nivel.</div>`;
  }
  h += `</div>`;
  return h;
}

function renderWeekView() {
  let h = '';
  const w = state.week;
  const level = currentLevel(w);

  if (CHECKPOINT_WEEKS.includes(w)) h += renderCheckpointCard(w);

  h += `<div class="level-badge">${ROUTINE_LEVELS[level].name}</div>`;
  h += sectionTitle('📅', 'Tu Semana', 'Toca un día para abrir su carpeta');

  for (let d = 0; d < 7; d++) {
    const key = dayKey(w, d);
    const isOpen = !!state.expanded[key];
    const type = getDayRoutineType(w, d);
    const routine = type ? getRoutine(level, type) : null;
    const overrideVal = state.data[`override_w${w}_d${d}`] || 'DEFAULT';

    let doneCount = 0, totalCount = 0;
    if (routine) {
      const allItems = [...warmupFor(type), ...routine.exercises, ...COOLDOWN];
      totalCount = allItems.length;
      allItems.forEach(ex => { if (state.data[`${key}_ex_${ex.id}`]) doneCount++; });
    }
    const pain = state.data[`${key}_pain`];
    const flagged = !!state.data[`${key}_flag`];
    const painClass = painBadgeClass(pain);

    let badges = '';
    if (routine) badges += `<span class="badge ${doneCount===totalCount && totalCount>0 ? 'ok':'mid'}">${doneCount}/${totalCount}</span>`;
    if (painClass) badges += `<span class="badge ${painClass}">Dolor ${pain}</span>`;
    if (flagged) badges += `<span class="badge high">🚩</span>`;

    h += `<div class="day-folder">
      <div class="day-folder-header" onclick="toggleDayOpen(${w},${d})">
        <span class="day-folder-icon">${routine ? '🦵' : '🛌'}</span>
        <div class="day-folder-body">
          <div class="day-folder-name">${DAY_NAMES[d]}${(w === currentWeekNumber() && d === todayDayIndex()) ? ' <span style="font-size:10px;color:#a094c0;border:1px solid #4c3880;border-radius:20px;padding:1px 7px;margin-left:4px;">HOY</span>' : ''}</div>
          <div class="day-folder-sub">${routine ? routine.label : 'Descanso'}</div>
        </div>
        <div class="day-folder-badges">${badges}</div>
        <span class="chevron ${isOpen?'open':''}">▶</span>
      </div>
      <div class="day-folder-content ${isOpen?'open':''}">
        ${routine ? `<div class="day-type-row">
          <label>¿No pudiste hoy? Mueve esta rutina a otro día</label>
          <select onchange="if(this.value!=='') moveTraining(${w},${d},Number(this.value)); this.selectedIndex=0;">
            <option value="">Mover a...</option>
            ${DAY_NAMES.map((name,dd)=> dd!==d ? `<option value="${dd}">${name}</option>` : '').join('')}
          </select>
        </div>` : ''}
        <div class="day-type-row">
          <label>Tipo de día (por si cambias tu semana)</label>
          <select onchange="setDayOverride(${w},${d},this.value)">
            <option value="DEFAULT" ${overrideVal==='DEFAULT'?'selected':''}>Normal (según tu programación)</option>
            <option value="REST" ${overrideVal==='REST'?'selected':''}>Descanso</option>
            <option value="A" ${overrideVal==='A'?'selected':''}>Rutina A</option>
            <option value="B" ${overrideVal==='B'?'selected':''}>Rutina B</option>
            <option value="C" ${overrideVal==='C'?'selected':''}>Rutina C</option>
            <option value="D" ${overrideVal==='D'?'selected':''}>Rutina D (tren superior, empuje)</option>
            <option value="E" ${overrideVal==='E'?'selected':''}>Rutina E (tren superior, jalón)</option>
          </select>
        </div>`;

    if (routine) {
      h += renderExerciseGroup('🔥 Calentamiento', warmupFor(type), w, d, key, false);
      h += renderExerciseGroup(isUpper(type) ? '💪 Rutina principal' : '🦵 Rutina principal', routine.exercises, w, d, key, true);
      h += renderExerciseGroup('🧊 Enfriamiento y recuperación', COOLDOWN, w, d, key, false);
    } else {
      h += `<div class="rest-note">Día de descanso. Si quieres, anota abajo cómo sientes la rodilla.</div>`;
    }

    h += `<button class="flag-toggle ${flagged?'on':''}" onclick="toggleFlag(${w},${d})">🚩 ${flagged ? 'Hinchazón/chasquido marcado hoy' : 'Marcar hinchazón o chasquido'}</button>`;

    const currentDayRom = state.data[`${key}_rom`] || '';
    h += `<div class="control-block">
        <div class="control-title">Control esencial</div>
        <div class="control-row">
          <div class="control-field"><label>Dolor (0-10)</label><input type="number" min="0" max="10" id="pain_${key}" value="${pain !== undefined ? pain : ''}"></div>
        </div>
        <div class="control-field" style="margin-bottom:10px;">
          <label>ROM general del día ${romInfoButton()}</label>
          <select id="rom_${key}">
            ${ROM_OPTIONS.map(o => `<option value="${o.value}" ${currentDayRom===o.value?'selected':''}>${o.label}</option>`).join('')}
          </select>
        </div>
        ${state.romInfoOpen ? romInfoBlock() : ''}
        <button class="save-day-btn" onclick="saveDayControl(${w},${d})">Guardar control del día</button>
      </div>
    </div></div>`;
  }

  h += sectionTitle('🚫', 'Límites Inquebrantables', 'Si rompes uno, avisa a tu fisio');
  h += `<div class="limits-card">`;
  LIMITS.forEach((rule, i) => {
    h += `<div class="limit-row" ${i===LIMITS.length-1?'style="border:none"':''}><span class="limit-x">✖</span><span class="limit-text">${rule}</span></div>`;
  });
  h += `</div>`;
  return h;
}

function renderReviewView(ws) {
  const w = state.week;
  const level = currentLevel(w);
  const avgPain = weekAvgPain(w);
  let h = '';
  h += `<div class="review-hero">
    <div class="review-eyebrow">Revisión Dominical — Semana ${w}</div>
    <div class="review-pct" style="color:${pctColor(ws.pct)}">${ws.pct}%</div>
    <div class="review-sub">${ws.done} de ${ws.total} ejercicios completados</div>
    ${avgPain !== null ? `<div class="review-pain">🚩 Dolor promedio de la semana: ${avgPain}/10</div>` : ''}
  </div>`;

  h += sectionTitle('🔍', `Constancia por rutina — Semana ${w}`, '¿Qué día te está costando más?');
  for (let d = 0; d < 7; d++) {
    const type = getDayRoutineType(w, d);
    if (!type) continue;
    const routine = getRoutine(level, type);
    const key = dayKey(w, d);
    const allItems = [...warmupFor(type), ...routine.exercises, ...COOLDOWN];
    let count = 0;
    allItems.forEach(ex => { if (state.data[`${key}_ex_${ex.id}`]) count++; });
    const pct = Math.round((count/allItems.length)*100);
    h += `<div class="progress-item">
      <span class="progress-emoji">🦵</span>
      <div class="progress-body">
        <div class="progress-name">${DAY_NAMES[d]} — ${routine.label}</div>
        <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${pct}%;background:${pctColor(pct)}"></div></div>
      </div>
      <span class="progress-count" style="color:${pctColor(pct)}">${count}/${allItems.length}</span>
    </div>`;
  }

  h += sectionTitle('🎯', 'Historial de Revisiones de Bloque', 'Cada 4 semanas');
  const relevantCheckpoints = CHECKPOINT_WEEKS.filter(cw => cw <= w);
  if (relevantCheckpoints.length === 0) {
    h += `<div class="progress-item"><span class="progress-body" style="color:#5a5070; font-size:12px;">Tu primera revisión de bloque será en la Semana 4.</span></div>`;
  } else {
    h += `<div class="project-list">`;
    relevantCheckpoints.forEach((cw, i) => {
      const st = checkpointStatus(cw);
      let label, color;
      if (st.allMet) { label = '✅ Cumplido'; color = '#4ade80'; }
      else if (st.anyMarked) { label = '⚠️ Parcial'; color = '#f59e0b'; }
      else { label = '— Sin revisar'; color = '#5a5070'; }
      h += `<div class="cp-history-row" ${i===relevantCheckpoints.length-1?'style="border:none"':''}><span>Semana ${cw}</span><span class="cp-history-status" style="color:${color}">${label}</span></div>`;
    });
    h += `</div>`;
  }

  h += sectionTitle('📈', 'Historial de Semanas', 'Tendencia de constancia');
  h += `<div class="week-history">`;
  const scores = [];
  for (let ww = 1; ww <= WEEKS_TOTAL; ww++) {
    const s = weekScore(ww);
    scores.push({ w: ww, ...s });
    const isActive = ww === w;
    h += `<div class="week-pill" style="background:${s.pct===0?'#0f0f1a':'#1a1630'};border-color:${isActive?'#7c5cbf':'#1e1a2e'}">
      <div class="week-pill-label">S${ww}</div>
      <div class="week-pill-val" style="color:${s.pct===0?'#2a2040':pctColor(s.pct)}">${s.pct>0?s.pct+'%':'—'}</div>
    </div>`;
  }
  h += `</div>`;

  const completed = scores.filter(s => s.pct > 0);
  if (completed.length > 0) {
    const best = completed.reduce((a,b) => a.pct > b.pct ? a : b);
    const worst = completed.length > 1 ? completed.reduce((a,b) => a.pct < b.pct ? a : b) : null;
    h += `<div class="bw-row"><div class="bw-card best"><div class="bw-eyebrow">Mejor semana</div><div class="bw-week">S${best.w}</div><div class="bw-pct">${best.pct}%</div></div>`;
    if (worst && worst.w !== best.w) {
      h += `<div class="bw-card worst"><div class="bw-eyebrow">Área de mejora</div><div class="bw-week">S${worst.w}</div><div class="bw-pct">${worst.pct}%</div></div>`;
    }
    h += `</div>`;
  }

  h += `<div class="footer-note">📅 Próxima revisión: <span>Domingo</span><br>Cada casilla es información real para tu rodilla. Sin autoengaños.</div>`;
  return h;
}

function romInfoButton() {
  return `<span class="link" style="margin-left:6px; text-transform:none; font-weight:400;" onclick="toggleRomInfo()">${state.romInfoOpen ? '(ocultar diagrama)' : '(¿qué es esto? ver diagrama)'}</span>`;
}
function romInfoBlock() {
  return `<div class="rom-info-block">
    ${ROM_DIAGRAM_SVG}
    <div class="rom-info-text">
      <b>ROM</b> = Rango de Movimiento: hasta dónde doblas la rodilla. 140° es lo normal (talón casi toca el glúteo), 0° es pierna recta sin doblar. Elige la opción que más se parezca a lo que sientes, no necesitas medirlo exacto.
    </div>
  </div>`;
}

function renderExerciseGroup(label, items, w, d, key, showRom) {
  let h = `<div class="exercise-group-label">${label}</div>`;
  items.forEach(ex => {
    const done = !!state.data[`${key}_ex_${ex.id}`];
    const videoUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent(ex.name + ' técnica correcta ejercicio')}`;
    const romVal = state.data[`${key}_ex_${ex.id}_rom`] || '';
    h += `<div class="exercise-row">
      <div class="exercise-check ${done?'done':''}" onclick="toggleExercise(${w},${d},'${ex.id}')">${done?'✓':''}</div>
      <div style="flex:1;">
        <div class="exercise-name">${ex.name}</div>
        <div class="exercise-reps">${ex.reps}</div>
        <a class="exercise-video" href="${videoUrl}" target="_blank" rel="noopener">▶ Ver técnica</a>
        ${showRom ? `<select class="ex-rom-select" onchange="setExerciseRom(${w},${d},'${ex.id}',this.value)">
          ${ROM_OPTIONS.map(o => `<option value="${o.value}" ${romVal===o.value?'selected':''}>ROM: ${o.short}</option>`).join('')}
        </select>` : ''}
      </div>
    </div>`;
  });
  return h;
}

function sectionTitle(emoji, title, subtitle) {
  return `<div class="section-title"><div class="section-title-row"><span>${emoji}</span><span class="section-title-text">${title}</span></div><div class="section-subtitle">${subtitle}</div></div>`;
}

function changeWeek(dir) {
  state.week = Math.max(1, Math.min(WEEKS_TOTAL, state.week + dir));
  render();
  window.scrollTo(0, 0);
}
function setView(v) {
  state.view = v;
  render();
  window.scrollTo(0, 0);
}

loadState();
goToCurrentWeek();
render();
</script>
</body>
</html>
